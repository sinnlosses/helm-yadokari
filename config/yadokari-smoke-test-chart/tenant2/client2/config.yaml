# 複数appのimage tag更新のみを検証するclient（docs/smoke-test.md 参照）。
# Helmの向き先ブランチは values.yaml の初期値を helm.branchName と同じ値にしてあるので差分が出ない
helm:
  branchName: release/2026-q1
  locations:
    - valuesPath: charts/smoke-tenant2/client2/values.yaml
      anchor: t2c2HelmTargetBranch
apps:
  - projectId: 82861978
    projectName: sample-qa-sprint
    branchToSync: main
    locations:
      - valuesPath: charts/smoke-tenant2/client2/values.yaml
        anchor: t2c2QaSprintVersion
  - projectId: 82861977
    projectName: sample-develop-client
    branchToSync: main
    locations:
      - valuesPath: charts/smoke-tenant2/client2/values.yaml
        anchor: t2c2DevelopClientVersion
