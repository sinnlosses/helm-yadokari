# 複数app + Helm向き先ブランチの更新に加え、1appが複数valuesPathに書き込むことを検証するclient（docs/smoke-test.md 参照）
helm:
  branchRef: release/2026-q1
  locations:
    - valuesPath: charts/smoke-tenant2/client1/values.yaml
      anchor: t2c1HelmTargetBranch
    - valuesPath: charts/smoke-tenant2/client1/values-extra.yaml
      anchor: t2c1HelmTargetBranchExtra
apps:
  - projectId: 82861978
    projectName: sample-qa-sprint
    branchToSync: main
    locations:
      - valuesPath: charts/smoke-tenant2/client1/values.yaml
        anchor: t2c1QaSprintVersion
      - valuesPath: charts/smoke-tenant2/client1/values-extra.yaml
        anchor: t2c1QaSprintVersionExtra
  - projectId: 82861977
    projectName: sample-develop-client
    branchToSync: main
    locations:
      - valuesPath: charts/smoke-tenant2/client1/values.yaml
        anchor: t2c1DevelopClientVersion
