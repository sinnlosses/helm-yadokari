# 複数chartリポジトリにまたがるappと、branchToSyncが複数種類になることを検証するユニット（docs/smoke-test.md 参照）
helm:
  branchToSync: release/2026-q1
  chart:
    - valuesPath: charts/shared-app/values.yaml
      anchor: sharedHelmTargetBranch
apps:
  - projectId: 82861978
    projectName: sample-qa-sprint
    branchToSync: develop
    chart:
      - valuesPath: charts/shared-app/values.yaml
        anchor: sharedQaSprintVersion
