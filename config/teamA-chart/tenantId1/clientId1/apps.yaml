helm:
  branchToSync: release/2026-q1
  chart:
    - valuesPath: charts/my-app/values.yaml
      anchor: myAppTargetBranch
    - valuesPath: charts/another-app/values.yaml
      anchor: anotherAppTargetBranch
    - valuesPath: charts/multi-service-app/values.yaml
      anchor: multiServiceAppTargetBranch
apps:
  - projectId: 888
    projectName: my-app          # タグを取得するGitLabプロジェクト
    branchToSync: main                    # 追跡するブランチ
    chart:
      - valuesPath: charts/my-app/values.yaml
        anchor: myAppVersion  # values.yaml内のYAMLアンカー名
  - projectId: 889
    projectName: another-app
    branchToSync: main
    chart:
      - valuesPath: charts/another-app/values.yaml
        anchor: tenantId1client1AppsVersion  # values.yaml内のYAMLアンカー名
  - projectId: 890
    projectName: multi-service-app # 1プロジェクトでWebAPI/バッチ/デーモンなど複数appを管理する例
    branchToSync: main             # 1つのvalues.yaml内に複数のアンカーで各appのタグを持つ構成
    chart:
      - valuesPath: charts/multi-service-app/values.yaml
        anchor: multiServiceAppWebapiVersion
      - valuesPath: charts/multi-service-app/values.yaml
        anchor: multiServiceAppBatchVersion
      - valuesPath: charts/multi-service-app/values.yaml
        anchor: multiServiceAppDaemonVersion
