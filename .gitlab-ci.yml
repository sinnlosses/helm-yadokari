spec:
  inputs:
    DRY_RUN:
      description: "ブランチ作成・MR作成をスキップし、更新予定の内容のみログ出力する（true のとき MR は作成されません）"
      default: "false"
      type: boolean
    CONCURRENCY_LIMIT:
      description: "(chartリポジトリ, 設定ユニット)単位の同時処理数（1〜20の整数）"
      default: "3"
      type: string
    CONFIG_PATH:
      description: "設定ファイル(config/)のパス（省略時はデフォルト: config/）"
      default: ""
      type: string
    TARGET_CHART:
      description: "特定のchartディレクトリ名のみ対象にする（省略時は全chart）。config/直下のディレクトリ名を指定"
      default: ""
      type: string
    TARGET_UNITS:
      description: "特定の設定ユニットのみ対象にする（省略時は全設定ユニット）。unitPath（config/<chartディレクトリ>/ からの深さ1〜2の相対パス）で、カンマ区切りで複数指定可"
      default: ""
      type: string
---
# ──────────────────────────────────────────────────────────────────
# 【必須】Settings > CI/CD > Variables に以下を登録してください:
#   GITLAB_URL    — GitLab の URL（例: https://gitlab.example.com）
#                   ※ Protected: OFF（下記 ACCESS_TOKEN と同じ理由）
#   ACCESS_TOKEN  — GitLab Group/Project Access Token
#                   （read_api + write_repository + MR作成権限。最小権限で発行すること）
#                   ※ Masked: ON / Protected: OFF
#                   Protected にすると保護ブランチ以外のパイプラインで空になり、
#                   MR時の設定検証（validate-config-remote）が実行できなくなるため。
#                   MRのたびに設定の実在チェックを確実に通す運用を優先している
# ──────────────────────────────────────────────────────────────────

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - validate
  - deploy
  - renovate

variables:
  GITLAB_URL:
    value: ""
    description: "【必須】GitLab インスタンスの URL（例: https://gitlab.example.com）"
  DRY_RUN:
    value: "$[[ inputs.DRY_RUN ]]"
    description: "true にするとブランチ作成・MR作成をスキップし、ログのみ出力します（デフォルト: false）"
  CONCURRENCY_LIMIT:
    value: "$[[ inputs.CONCURRENCY_LIMIT ]]"
    description: "(chartリポジトリ, 設定ユニット)単位の同時処理数（1〜20の整数、デフォルト: 3）省略可"
  CONFIG_PATH:
    value: "$[[ inputs.CONFIG_PATH ]]"
    description: "設定ファイルのパス（省略時はデフォルト: config/）省略可"
  TARGET_CHART:
    value: "$[[ inputs.TARGET_CHART ]]"
    description: "特定のchartディレクトリのみ対象にする場合に指定（省略時は全chart）"
  TARGET_UNITS:
    value: "$[[ inputs.TARGET_UNITS ]]"
    description: "特定の設定ユニットのみ対象にする場合に unitPath（config/<chartディレクトリ>/ からの深さ1〜2の相対パス）で、カンマ区切りで複数指定（省略時は全設定ユニット）"
  PNPM_STORE_DIR:
    value: .pnpm-store
    description: "pnpm キャッシュの保存先（変更不要）"
  RENOVATE_TOKEN:
    value: ""
    description: "【Renovate 用】GitLab PAT（api スコープ必須）。Settings > CI/CD > Variables に Masked で登録してください"

.node-setup:
  image: node:22.13-alpine
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - $PNPM_STORE_DIR
  before_script:
    - npm install -g corepack
    - corepack enable
    - corepack prepare pnpm@11.5.1 --activate
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile

audit:
  extends: .node-setup
  stage: validate
  script:
    - pnpm audit --audit-level=high
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # critical 以上の脆弱性をブロックしたい場合は allow_failure: false に変更すること
  allow_failure: true
  timeout: 10 minutes

check:
  extends: .node-setup
  stage: validate
  script:
    - pnpm check
    - pnpm build
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 15 minutes

# config/ に書かれた projectId・ブランチ・valuesPath・アンカーが GitLab 上に実在するかを
# MR の時点で検証する（読み取りのみ。タグ・ブランチ・MR は作らない）。
# 【必須】ACCESS_TOKEN / GITLAB_URL を MR パイプラインからも参照できるようにしておくこと
#   （Protected: OFF。このジョブは読み取りしか行わないため read_api のみのトークンでよい）。
#   参照できない場合このジョブは「実在チェックを実行できません」で失敗する。設定ミスを
#   確実に止めるため、条件付きスキップにはしていない。
# 定期実行（schedule）では実行しない: 1つの設定ユニットの設定ミスで全設定ユニットの更新が
#   止まるのを避け、本体の実行時に該当する設定ユニットだけを ERROR にする従来どおりの挙動に任せる。
validate-config-remote:
  extends: .node-setup
  stage: validate
  script:
    - pnpm lint:validate-config:remote
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 10 minutes

# 本体。定期実行（schedule）と手動実行（web）のどちらでも自動で開始する。
# web を when: manual にしない: 手動実行の主な用途が DRY_RUN での確認で、そのたびに
#   ジョブを手で開始させる手間に見合わないと判断した。
#   トレードオフとして、DRY_RUN の既定値は false なので、check や validate-config-remote を
#   回すつもりで Run pipeline を実行すると本物のMR・ブランチ・タグが作られる。
#   MRを作りたくないときは Run pipeline の Inputs で DRY_RUN を true にすること。
update-app-versions:
  extends: .node-setup
  stage: deploy
  interruptible: false
  needs: [check]
  script:
    - pnpm start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE != "true"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 30 minutes

# ──────────────────────────────────────────────────────────────────
# Renovate — 依存自動更新（このCLI自体の devDependencies 等を更新する）
# 【必須】Settings > CI/CD > Variables に登録:
#   RENOVATE_TOKEN — GitLab PAT（api スコープ）。Masked: ON 推奨
# 【必須】Settings > CI/CD > Schedules にスケジュールを作成:
#   変数 RENOVATE=true を追加すること（他のスケジュールと区別するため）
# ──────────────────────────────────────────────────────────────────
renovate:
  stage: renovate
  image: renovate/renovate:latest
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_SERVER_URL/api/v4
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"'
  timeout: 10 minutes
